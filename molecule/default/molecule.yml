---
dependency:
  name: galaxy
driver:
  name: docker
lint: |
    yamllint .
    ansible-lint
    flake8
platforms:
  - name: haproxy-c7
    pre_build_image: true
    image: eniocarboni/docker-rockylinux-systemd:9
    image_version: latest
    command: /sbin/init
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /tmp
    groups:
      - extra_options
    #pre_build_image: true
    #volumes:
    #    - /sys/fs/cgroup:/sys/fs/cgroup:ro
    #pre_build_image: true

provisioner:
  name: ansible
  group_vars:
    all:
      ansible_remote_tmp: /tmp
  lint:
    name: ansible-lint

scenario:
  name: default
verifier:
  name: testinfra
